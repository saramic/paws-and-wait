<header class="site-header">
  <div class="wrap">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <svg class="brand-mark" viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
        <!-- detection reticle -->
        <path d="M6,18 L6,6 L18,6" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>
        <path d="M46,6 L58,6 L58,18" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>
        <path d="M6,46 L6,58 L18,58" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>
        <path d="M58,46 L58,58 L46,58" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>
        <!-- paw print -->
        <ellipse cx="32" cy="42" rx="13" ry="10" fill="var(--paper)"/>
        <circle cx="16" cy="26" r="6" fill="var(--paper)"/>
        <circle cx="25" cy="17" r="6.5" fill="var(--paper)"/>
        <circle cx="39" cy="17" r="6.5" fill="var(--paper)"/>
        <circle cx="48" cy="26" r="6" fill="var(--paper)"/>
      </svg>
      <span class="brand-text">{{ site.title }}</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
    </nav>
  </div>
</header>
